<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="index.css">
</head>

<body class="poppins-regular">
    <header class="bg-white  p-4 shadow  md:sticky top-0 z-50">
        <div class="lg:flex space-y-5 md:space-y-0  items-center justify-between  lg:max-w-7xl mx-auto ">
            <div class="flex items-center ml-12 md:ml-0  md:w-full lg:w-0 md:justify-center lg:justify-between">
                <h1 class="font-extrabold text-4xl text-center">🌿</h1>
                <h2 class="font-bold text-2xl text-emberld-800">GreenHaven</h2>
            </div>
            <nav>
                <ul class="flex md:gap-16 gap-3 ext-emerald-900 md:mt-5 lg:mt-0 md:justify-center lg:justify-between">
                    <li><a href="#">Home</a></li>
                    <li><a href="#">Shop</a></li>
                    <li><a href="#">About <span class="hidden md:inline">Us</span></a></li>
                    <li><a href="#">Contact</a></li>
                    <li><a href="#"><span class="hidden md:inline">🛒</span> Cart</a></li>
                </ul>
            </nav>
        </div>
    </header>


    <!-- banner session -->

    <main class="mt-16 ">
        <section class="lg:flex  banner-container max-w-7xl mx-auto p-2  lg:p-0">
            <div class="space-y-5 lg:w-1/2">
                <small class="bg-green-50 p-2 rounded-full block mt-4 w-48 text-green-500">🌱 Fresh from the
                    nursery</small>
                <h2 class="text-5xl lg:text-6xl mt-7 font-bold">Bring <span class="text-green-500">Nature</span> Into
                    <br> Your Home</h2>
                <p>Hand-picked indoor plants that brighten every corner, delivered fresh to your door with care tips
                    included.</p>
                <button class="p-4 rounded-2xl text-white font-medium bg-green-800">Shop Now</button>
                <div class="flex gap-4 md:gap-20  items-center">
                    <div>
                        500+
                        <h3>Plants</h3>
                    </div>
                    <div>
                        12k
                        <h3>Happy customers</h3>
                    </div>
                    <div>
                        4.9★
                        <h3>Rating</h3>
                    </div>
                </div>
            </div>
            <div class="lg:w-1/2  md:h-auto mt-10 lg:mt-0 ">
                <img class="rounded-3xl h-full object-center object-cover" src="images/banner.jpg" alt="">
            </div>
        </section>
    </main>


</body>

</html>
